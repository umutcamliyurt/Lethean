<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self';
  img-src 'self';
  connect-src 'self' http://localhost:8000 ipc: http://ipc.localhost https:;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  frame-ancestors 'none';
">
<meta name="referrer" content="no-referrer">
<title>Lethean</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="share-screen">
  <div class="auth-card share-card">
    <div class="wordmark">
      <svg width="26" height="26" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1"/>
        <path d="M9 15.2L5.35 3.98L14.9 10.92L3.1 10.92L12.65 3.98Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
        <circle cx="9" cy="7.6" r="1.7" stroke="currentColor" stroke-width="1"/>
        <path d="M7.6 6.3Q4.8 4.4 5.5 1.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <path d="M10.4 6.3Q13.2 4.4 12.5 1.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <path d="M7.7 8.6L6.9 10.2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <path d="M10.3 8.6L11.1 10.2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <span>Lethean</span>
    </div>

    <h1>Shared file</h1>
    <p class="subtitle">This link decrypts a file in your browser.</p>

    <div class="share-status" id="share-status" role="status" aria-live="polite">Loading&hellip;</div>

    <div id="share-body" class="hidden">
      <p class="share-filename" id="share-filename"></p>
      <p class="share-filesize" id="share-filesize"></p>
      <button type="button" class="btn-primary" id="share-download-btn">Download</button>
      <button type="button" class="btn-danger hidden" id="share-delete-btn">Delete this file</button>
      <p class="field-hint" id="share-usage-hint"></p>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script type="module" src="share-view.js"></script>
</body>
</html>
