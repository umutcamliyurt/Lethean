[package]
name = "lethean-fuse"
version = "0.1.0"
edition = "2021"
description = "A minimal FUSE client for Lethean"

[lib]
name = "lethean_fuse_lib"
path = "src/lib.rs"

[[bin]]
name = "lethean-fuse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ureq = { version = "2", default-features = false, features = ["tls", "json"] }

argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

flate2 = "1"

fuser = "0.14"
libc = "0.2"

env_logger = "0.11"
log = "0.4"
